<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Typewriter Sim</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="menus/tree.css">
  <link rel="stylesheet" href="menus/menus.css">
</head>

<body>

<!-- Desk and sheet of paper (decoration) -->
<div id="desk" aria-hidden="true"><div id="sheetBg"></div></div>

<!-- Writing area -->
<div id="wrap">
  <div id="sheet">
    <div id="spTop"></div>
    <div id="editor">
      <div id="hl" aria-hidden="true"></div>
      <textarea id="paper" spellcheck="true" lang="fr" autofocus placeholder="Commencez à taper…"></textarea>
    </div>
    <div id="spBottom"></div>
  </div>
</div>

<div id="caret" aria-hidden="true"></div>

<!-- Floor: hides everything below the writing line -->
<div id="floor" aria-hidden="true"></div>

<!-- Projects and chapters (foldable tree, top left) -->
<nav id="tree" aria-label="Projects and chapters">
  <button class="key" id="treeBtn" aria-expanded="false" aria-controls="treePanel"><span id="treeLabel">…</span></button>
  <div id="treeSheet">
    <!-- Paperclip (decoration) -->
    <svg class="tw-clip" viewBox="0 0 34 80" aria-hidden="true" focusable="false">
      <path class="wire"  d="M12 60V18A5 5 0 0 1 22 18V66A9.5 9.5 0 0 1 3 66V14A14 14 0 0 1 31 14V70"/>
      <path class="shine" d="M12 60V18A5 5 0 0 1 22 18V66A9.5 9.5 0 0 1 3 66V14A14 14 0 0 1 31 14V70"/>
    </svg>
    <div id="treePanel"></div>
  </div>
</nav>

<!-- Toolbar -->
<div id="bar">
    <span class="key select-wrap">
      <select id="texSelect" title="Export, copy or view the LaTeX" aria-label="TEX actions">
        <option value="" selected disabled hidden>Export & Manage</option>
        <option value="exportProject">Export project .tex</option>
        <option value="export">Export chapter .tex</option>
        <option value="copy">Copy chapter .tex</option>
        <option value="source">Show chapter source</option>
      </select>
    </span>

  <label class="key toggle" title="New paragraphs start with an indent">
    <input type="checkbox" id="indent" checked><span>indent</span>
  </label>

  <span class="key select-wrap">
      <select id="fmt" title="Page format (LaTex ouput and line wrapping)"></select>
    </span>

  <span id="cust" style="display:none">
      <input id="fW" type="number" step="0.1" min="5"   max="40" value="14" title="Width (cm)"> ×
      <input id="fH" type="number" step="0.1" min="5"   max="60" value="21" title="Height (cm)"> cm, margin
      <input id="fM" type="number" step="0.1" min="0.5" max="6"  value="2"  title="Margin (cm)">
  </span>

  <button class="key" id="bSnd"  title="Key-click sound"> ♪ </button>
  <button class="key" id="bFs"   title="Toggle fullscreen"> ⛶ </button>
  <button class="key" id="bHelp" title="Syntax">?</button>

  <button class="key" id="bMode" title="Switch between dark and light theme.">⏾</button>
</div>

<div id="count"></div>
<div id="toast"></div>

<!-- Overlay: LaTeX source or help -->
<div id="ov">
  <header>
    <button id="bOvCopy">copy</button>
    <button id="bClose">close</button>
  </header>
  <textarea id="src" readonly></textarea>
  <div class="help" id="help"></div>
</div>

<script src="typewritter.js"></script>
<script src="manage/export.js"></script>
<script src="menus/toolbar.js"></script>
<script src="utils/accents.js"></script>
<script src="manage/storage.js"></script>
<script src="manage/projects.js"></script>
<script src="menus/menus.js"></script>
<script src="utils/postits.js"></script>
</body>
</html>
